<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPG GM</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #111; color: #eee;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
  }
  #top { display: flex; justify-content: space-between; align-items: center;
         padding: 8px 12px; background: #1a1a1a; font-size: 13px; color: #aaa; gap: 6px; }
  #top button { background: #333; color: #ddd; font-size: 12px; padding: 6px 10px; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { white-space: pre-wrap; word-break: break-word; margin: 8px 0;
         padding: 10px 12px; border-radius: 12px; line-height: 1.5; font-size: 15px; }
  .user { background: #2b4a7a; margin-left: 12%; }
  .model { background: #222; margin-right: 4%; }
  #status { font-size: 12px; color: #aaa; padding: 0 12px; min-height: 16px; }
  #bar { display: flex; gap: 8px; padding: 8px; background: #1a1a1a; }
  textarea { flex: 1; height: 56px; border-radius: 8px; border: 0; padding: 8px;
             font-size: 16px; font-family: inherit; resize: none; }
  button { border: 0; border-radius: 8px; padding: 0 16px; font-size: 16px; cursor: pointer; }
  #send { background: #3b7ddd; color: #fff; }
  #send:disabled { background: #555; }
  .choice { display: block; width: 100%; padding: 12px; margin-bottom: 8px; background: #3b7ddd; color: #fff; text-align: left; }
  #cancel { display: block; width: 100%; padding: 10px; background: #444; color: #ddd; }
  .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
             background: rgba(0,0,0,.75); align-items: center; justify-content: center; padding: 16px; }
  .box { background: #222; border-radius: 12px; padding: 16px; max-width: 360px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .box input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border-radius: 8px; border: 0; margin-bottom: 8px; }
  .box label { display: block; font-size: 12px; color: #aaa; margin: 6px 0 4px; }
  .box a { color: #7db3ff; }
  .choices { display: flex; flex-direction: column; gap: 6px; margin: 4px 4% 10px 0; }
  .chbtn { background: #2a3f66; color: #fff; text-align: left; padding: 10px 12px; font-size: 14px; line-height: 1.4; white-space: normal; }
  #cmdbtn { background: #333; color: #ddd; padding: 0 12px; }
  #cmdGrid button { background: #333; color: #eee; font-size: 14px; padding: 10px 6px; text-align: left; }
  #hudbar { display: none; align-items: center; gap: 8px; padding: 6px 12px; background: #161616; border-bottom: 1px solid #2a2a2a; overflow-x: auto; cursor: pointer; }
  .hb { min-width: 92px; flex: 1; border-radius: 6px; padding: 2px 4px; }
  .hb-t { font-size: 11px; color: #ccc; margin-bottom: 3px; white-space: nowrap; }
  .hb-track { height: 8px; background: #2b2b2b; border-radius: 4px; overflow: hidden; }
  .hb-fill { height: 100%; width: 0; transition: width .5s ease; border-radius: 4px; }
  .hb.down { animation: hbdown .8s; }
  .hb.up { animation: hbup .8s; }
  @keyframes hbdown { 0%, 100% { background: transparent; } 30% { background: rgba(229,72,77,.4); } }
  @keyframes hbup { 0%, 100% { background: transparent; } 30% { background: rgba(34,197,94,.35); } }
  .hc { font-size: 12px; color: #ddd; background: #262626; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
  .hmenu { font-size: 16px; color: #aaa; padding: 0 4px; }
  #hudTabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 4px; }
  .htab { flex: 0 0 auto; background: #333; color: #ccc; font-size: 13px; padding: 8px 12px; }
  .htab.on { background: #3b7ddd; color: #fff; }
  .hrow { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #333; font-size: 14px; line-height: 1.4; }
  .hrow small { display: block; color: #999; font-size: 12px; }
  .hrow .hb-track { margin: 6px 0 2px; width: 100%; min-width: 120px; }
  .sk-fill { background: #8b5cf6; }
  .sk-fill.train { background: #f59e0b; }
  .skl { font-size: 11px; color: #888; margin: 8px 0 2px; }
  .skv { font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .skrisk { color: #f0a0a0; }
  .hrow b { white-space: nowrap; font-weight: 600; }
  .hnote { color: #999; font-size: 13px; padding: 8px 0; }
  .hbig { margin: 10px 0; }
  .hbig .hb-t { font-size: 13px; }
  .hbig .hb-track { height: 12px; }
  #enemybar { display: none; padding: 6px 12px 8px; background: #1f1414; border-bottom: 1px solid #3a2222; }
  .en-t { font-size: 13px; color: #f3d0d0; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
  .en-t small { color: #b99; font-size: 11px; text-align: right; }
  #enemybar .hb-track { height: 10px; }
  .en-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .dchip { font-size: 11px; color: #f5c9c9; background: #3a1f1f; border: 1px solid #6b2b2b; padding: 2px 8px; border-radius: 10px; line-height: 1.4; }
  .hcombat { background: #3a1f1f; border: 1px solid #6b2b2b; border-radius: 10px; padding: 8px 10px; margin: 10px 0; font-size: 13px; line-height: 1.5; }
  .sf { margin-bottom: 10px; }
  .sf-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .sf-head label { margin: 6px 0 4px; }
  .sf-in { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; font-family: inherit;
           border-radius: 8px; border: 0; margin-bottom: 4px; height: auto; resize: vertical; }
  .sf-hint { display: block; color: #888; font-size: 11px; line-height: 1.4; margin-bottom: 6px; }
  .sf-mini { background: #333; color: #ddd; font-size: 13px; padding: 4px 8px; flex: 0 0 auto; }
  .sf-tools { display: flex; gap: 4px; }
  #setupMsg { font-size: 13px; color: #f0b429; min-height: 18px; margin: 6px 0; white-space: pre-wrap; line-height: 1.5; }
  .chuse { background: #4a3a66; text-align: center; }
  .useit { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%;
           background: #2a3f66; color: #fff; text-align: left; padding: 10px 12px; font-size: 14px;
           line-height: 1.4; margin-bottom: 6px; white-space: normal; }
  .useit small { color: #bcd; font-size: 12px; display: block; }
  .useit b { white-space: nowrap; font-weight: 600; }
  .srow { display: flex; gap: 6px; margin-bottom: 10px; }
  .srow button { flex: 1; text-align: center; }
  #toast { display: none; position: fixed; left: 12px; right: 12px; bottom: 78px; background: rgba(30,30,30,.96); border: 1px solid #444; border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 1.6; z-index: 5; pointer-events: none; }
</style>
</head>
<body>
  <div id="top">
    <span>RPG GM</span>
    <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
      <button id="setupbtn" style="display:none;">📝 ฟอร์ม</button>
      <button id="copylink">🔗 ลิงก์เซฟ</button>
      <button id="entercode">🔑 ตั้งค่า</button>
      <button id="newgame">เริ่มเกมใหม่</button>
    </span>
  </div>
  <div id="hudbar" title="กดเพื่อดูสถานะทั้งหมด"></div>
  <div id="enemybar"></div>
  <div id="chat"></div>
  <div id="status"></div>
  <div id="bar">
    <button id="cmdbtn" title="คำสั่ง">📋</button>
    <textarea id="input" placeholder="พิมพ์การกระทำเอง หรือกดตัวเลือกด้านบน"></textarea>
    <button id="send">ส่ง</button>
  </div>

<div id="modal" class="overlay">
  <div class="box">
    <div style="margin-bottom:12px;font-size:15px;line-height:1.5;">เริ่มเกมใหม่ เลือกโลก<br><span style="font-size:12px;color:#aaa;">(บันทึกเก่าถูกเก็บไว้ในชีตอีกแท็บ ไม่ถูกลบ)</span></div>
    <button class="choice" data-preset="magic">🏫 โรงเรียนเวทมนตร์ (แบบเดิม)</button>
    <button class="choice" data-preset="custom">🌍 ออกแบบโลกใหม่ (AI ช่วยสร้าง)</button>
    <button id="cancel">ยกเลิก</button>
  </div>
</div>

<div id="codeModal" class="overlay">
  <div class="box">
    <div id="codeMsg" style="margin-bottom:10px;font-size:14px;line-height:1.5;white-space:pre-wrap;"></div>
    <label>Gemini API key ของคุณ (ขอฟรีที่ <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>)</label>
    <input id="keyInput" type="password" placeholder="วางคีย์ที่นี่" autocomplete="off">
    <div style="font-size:11px;color:#888;margin-bottom:8px;">คีย์เก็บไว้ในเบราว์เซอร์นี้ และถูกส่งผ่านเซิร์ฟเวอร์ของเกมเพื่อเรียก Gemini เท่านั้น ไม่ถูกบันทึกลงชีต</div>
    <label>รหัสผู้เล่น (ถ้ามีรหัสเดิมให้ใส่ ถ้าไม่มีกดสร้างผู้เล่นใหม่)</label>
    <input id="codeInput" placeholder="รหัสผู้เล่น" autocomplete="off">
    <button class="choice" id="codeGo">เข้าด้วยรหัสนี้</button>
    <button class="choice" id="codeNew">✨ สร้างผู้เล่นใหม่</button>
  </div>
</div>

<div id="hudModal" class="overlay">
  <div class="box" style="max-width:420px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span style="font-size:15px;">🎮 สถานะ</span>
      <button id="hudClose" style="background:#444;color:#ddd;padding:6px 12px;font-size:13px;">ปิด</button>
    </div>
    <div id="hudTabs"></div>
    <div id="hudBody"></div>
  </div>
</div>
<div id="toast"></div>

<div id="useModal" class="overlay">
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span id="useTitle" style="font-size:15px;"></span>
      <button id="useClose" style="background:#444;color:#ddd;padding:6px 12px;font-size:13px;">ปิด</button>
    </div>
    <label>เป้าหมาย / วิธีใช้ (ไม่บังคับ เช่น "หมาป่าตัวซ้าย", "กับตัวเอง")</label>
    <input id="useTarget" placeholder="เว้นว่างได้" autocomplete="off">
    <div id="useList"></div>
  </div>
</div>

<div id="skillModal" class="overlay">
  <div class="box">
    <div id="skTitle" style="font-size:14px;color:#c4b5fd;margin-bottom:6px;"></div>
    <div id="skName" style="font-size:20px;font-weight:600;"></div>
    <div id="skMeta" style="font-size:12px;color:#aaa;margin:2px 0 6px;"></div>
    <div id="skBody"></div>
    <button id="skOk" class="choice" style="text-align:center;margin:12px 0 0;">รับทราบ</button>
  </div>
</div>

<div id="setupModal" class="overlay">
  <div class="box" style="max-width:520px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span id="setupTitle" style="font-size:16px;"></span>
      <button id="setupClose" style="background:#444;color:#ddd;padding:6px 12px;font-size:13px;">ปิด</button>
    </div>
    <div id="setupIntro" style="font-size:12px;color:#aaa;line-height:1.5;margin-bottom:8px;"></div>
    <button id="setupPreset" class="chbtn" style="display:none;width:100%;margin-bottom:10px;">🏫 ข้ามไปใช้โลกพรีเซ็ต: โรงเรียนเวทมนตร์</button>
    <label id="setupConceptLabel"></label>
    <textarea id="setupConcept" class="sf-in" rows="2"></textarea>
    <div class="srow">
      <button id="setupDraft" class="chbtn">✨ ให้ AI ร่าง</button>
      <button id="setupRandom" class="chbtn">🎲 สุ่มทั้งหมด</button>
    </div>
    <div id="setupForm"></div>
    <button id="setupAdd" class="chbtn" style="display:none;width:100%;margin-bottom:8px;background:#333;">+ เพิ่มช่องของคุณเอง</button>
    <div id="setupMsg"></div>
    <button id="setupOk" class="choice" style="text-align:center;">✅ ยืนยัน</button>
  </div>
</div>

<div id="cmdModal" class="overlay">
  <div class="box">
    <div style="margin-bottom:10px;font-size:15px;">📋 คำสั่ง <span style="font-size:12px;color:#aaa;">(ไม่นับเทิร์น ไม่ใช้เวลาในเกม)</span></div>
    <div id="cmdGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;"></div>
    <button id="cmdClose" style="display:block;width:100%;padding:10px;background:#444;color:#ddd;">ปิด</button>
  </div>
</div>

<script>
  // ★ วาง URL ของ Web App (ที่ลงท้ายด้วย /exec) จาก Apps Script ตรงนี้ ★
  var API_URL = 'https://script.google.com/macros/s/AKfycbwA_yKG52MneFH2A1NipCmJv9h8PDtw_vS-1UHDXEe4JuZrXS9jO8dNCrZE6wZlMoNZ/exec';

  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var statusEl = document.getElementById('status');

  function add(role, text) {
    // ลบปุ่มตัวเลือกของข้อความก่อนหน้า (ตอบไปแล้วหรือมีข้อความใหม่เข้ามา)
    Array.prototype.forEach.call(document.querySelectorAll('.choices'), function (e) { e.remove(); });
    var d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = text;
    chat.appendChild(d);
    if (role === 'model' && String(text).indexOf('⚠️') !== 0) lastModelText = text;
    chat.scrollTop = chat.scrollHeight;
  }

  // ตัวเลือกล่าสุดจากเซิร์ฟเวอร์ (GM ส่งมาในบล็อก CHOICES) + ข้อความล่าสุดของ GM (ใช้เป็นตัวสำรอง)
  var curChoices = { list: [], panel: false };
  var lastModelText = '';

  // ตัวสำรอง: เซฟเก่าที่ยังไม่มีตัวเลือกจากเซิร์ฟเวอร์ ให้แปลง A) B) C) ในข้อความ GM เป็นปุ่ม
  function textChoices(text) {
    var opts = [];
    String(text || '').split('\n').forEach(function (line) {
      var m = line.match(/^\s*([A-E])[\)\.]\s+(.+)$/);
      if (m) opts.push({ label: m[1] + ') ' + m[2].trim(), send: 'เลือกข้อ ' + m[1] + ': ' + m[2].trim() });
    });
    return opts.length >= 2 ? opts : [];
  }

  function setBusy(busy, label) {
    sendBtn.disabled = busy;
    statusEl.textContent = busy ? (label || 'กำลังคิด...') : '';
  }

  // เรียก API ของ Apps Script (ส่งเป็น text/plain เพื่อไม่ให้เบราว์เซอร์ต้องทำ preflight)
  function api(action, payload) {
    if (API_URL.indexOf('https://script.google.com/') !== 0) {
      return Promise.reject(new Error('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html'));
    }
    var body = Object.assign({ action: action }, payload || {});
    return fetch(API_URL, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .catch(function (e) {
        throw new Error('เชื่อมต่อเซิร์ฟเวอร์เกมไม่ได้ (' + e.message + ')');
      });
  }

  var CODE_RE = /^[A-Za-z0-9\-]{6,40}$/;
  var code = '';
  var apiKey = '';
  try { code = localStorage.getItem('rpg_code') || ''; } catch (e) {}
  try { apiKey = localStorage.getItem('rpg_key') || ''; } catch (e) {}
  var fromLink = '';
  try { fromLink = decodeURIComponent((location.hash || '').replace(/^#/, '')); } catch (e) {}
  if (CODE_RE.test(fromLink)) code = fromLink;   // รหัสในลิงก์มาก่อนรหัสที่จำไว้ในเบราว์เซอร์

  // อัปเดตความจำทำเบื้องหลัง (เซิร์ฟเวอร์สั่งเป็นรอบ ๆ ละ ~3 เทิร์น) ปุ่มส่งไม่ล็อก
  // ถ้าผู้เล่นส่งข้อความระหว่างนั้น จะเก็บเข้าคิวแล้วส่งให้เองเมื่ออัปเดตเสร็จ (เซิร์ฟเวอร์ประมวลผลได้ทีละงานต่อผู้เล่น)
  var memBusy = false;
  var queuedText = '';

  function syncMemory(done) {
    memBusy = true;
    if (!sendBtn.disabled) statusEl.textContent = '💾 กำลังบันทึกความจำ... (พิมพ์ต่อได้ ระบบจะส่งให้เมื่อเสร็จ)';
    api('memory', { code: code, key: apiKey })
      .then(function (res) {
        if (res && res.more) { syncMemory(done); return; }
        var warn = '';
        if (res && !res.ok && !res.busy) {
          warn = '⚠️ บันทึกความจำไม่สำเร็จ (จะลองใหม่รอบถัดไป): ' + res.error;
        }
        memBusy = false;
        done(warn);
      })
      .catch(function (err) { memBusy = false; done('⚠️ บันทึกความจำไม่สำเร็จ: ' + err.message); });
  }

  function finishSync(warn) {
    setBusy(false);
    statusEl.textContent = warn || '';
    if (queuedText) {
      var q = queuedText;
      queuedText = '';
      sendText(q);
    }
  }

  // c ว่าง = สร้างผู้เล่นใหม่, มีรหัส = เล่นต่อ แล้วโหลดบทสนทนาเก่า
  function boot(c) {
    setBusy(true, 'กำลังโหลด...');
    api('start', { code: c })
      .then(function (res) {
        if (!res.ok) { askCode('⚠️ ' + res.error); return; }
        code = res.code;
        try { localStorage.setItem('rpg_code', code); } catch (e) {}
        try { history.replaceState(null, '', '#' + code); } catch (e) {}
        setHud(res.hud || null);
        chat.innerHTML = '';
        res.history.forEach(function (r) { add(r.role, r.text); });
        curChoices = { list: res.choices || [], panel: !!res.panel };
        renderChoices();
        applyStage(res.stage, true);
        setBusy(false);
        syncMemory(finishSync);     // ตอนเปิดหน้า ตามความจำให้ทันของที่ค้างอยู่
      })
      .catch(function (err) { setBusy(false); add('model', '⚠️ ' + err.message); });
  }

  var codeModal = document.getElementById('codeModal');
  function askCode(msg) {
    setBusy(false);
    document.getElementById('codeMsg').textContent = msg ||
      ('รหัสผู้เล่นตอนนี้: ' + code + '\nจดรหัสนี้ไว้ หรือกดปุ่ม 🔗 ลิงก์เซฟ เก็บเป็นบุ๊กมาร์ก เพื่อเล่นต่อบนเครื่องอื่น');
    document.getElementById('codeInput').value = '';
    document.getElementById('keyInput').value = apiKey;
    codeModal.style.display = 'flex';
  }

  // บันทึกคีย์ที่กรอก (ต้องมีคีย์ก่อนเริ่มเล่น)
  function saveKey() {
    var k = document.getElementById('keyInput').value.trim();
    if (!k) { document.getElementById('codeMsg').textContent = '⚠️ กรุณาใส่ Gemini API key ก่อน'; return false; }
    apiKey = k;
    try { localStorage.setItem('rpg_key', apiKey); } catch (e) {}
    return true;
  }

  document.getElementById('entercode').addEventListener('click', function () { askCode(); });
  document.getElementById('copylink').addEventListener('click', function () {
    if (!code) { statusEl.textContent = 'ยังไม่มีรหัสผู้เล่น'; return; }
    var link = location.href.split('#')[0] + '#' + code;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(function () {
        statusEl.textContent = '✅ คัดลอกลิงก์เซฟแล้ว เก็บเป็นบุ๊กมาร์กไว้ได้ (ใครมีลิงก์นี้ก็เล่นเซฟนี้ได้)';
      }, function () { window.prompt('คัดลอกลิงก์นี้:', link); });
    } else {
      window.prompt('คัดลอกลิงก์นี้:', link);
    }
  });
  document.getElementById('codeGo').addEventListener('click', function () {
    if (!saveKey()) return;
    var c = document.getElementById('codeInput').value.trim() || code;
    if (!c) { document.getElementById('codeMsg').textContent = '⚠️ ใส่รหัสผู้เล่น หรือกดสร้างผู้เล่นใหม่'; return; }
    codeModal.style.display = 'none';
    boot(c);
  });
  document.getElementById('codeNew').addEventListener('click', function () {
    if (!saveKey()) return;
    codeModal.style.display = 'none';
    boot('');
  });

  if (code && apiKey) boot(code);
  else if (code) askCode('พบรหัสผู้เล่นของคุณแล้ว (' + code + ')\nใส่ Gemini API key ของคุณ แล้วกด "เข้าด้วยรหัสนี้" เพื่อเล่นต่อ');
  else askCode('ยินดีต้อนรับ ใส่ Gemini API key ของคุณ แล้วใส่รหัสผู้เล่นเดิม หรือกดสร้างผู้เล่นใหม่');

  function sendText(text) {
    text = String(text || '').trim();
    if (!text || sendBtn.disabled) return;
    if (memBusy) {                       // กำลังบันทึกความจำอยู่ รอคิวแล้วส่งให้เอง
      if (queuedText) return;
      queuedText = text;
      statusEl.textContent = '⏳ รอบันทึกความจำให้เสร็จ แล้วจะส่งให้อัตโนมัติ: ' + text.slice(0, 40);
      return;
    }
    add('user', text);
    setBusy(true, 'กำลังคิด...');
    api('turn', { code: code, text: text, key: apiKey })
      .then(function (res) {
        if (res.ok) {
          curChoices = { list: res.choices || [], panel: !!res.panel };
          add('model', res.text);
          if (res.hud !== undefined) setHud(res.hud, res.hudEvents);
          renderChoices();
          showSkillPopups(res.skillEvents);
          if (res.memPending) syncMemory(finishSync);   // ตอบผู้เล่นก่อน ถึงรอบแล้วค่อยบันทึกความจำเบื้องหลัง
          else setBusy(false);
        } else {
          add('model', '⚠️ ' + res.error);
          renderChoices();          // คืนปุ่มตัวเลือกเดิม (ข้อความนี้ยังไม่ถูกบันทึก)
          setBusy(false);
        }
      })
      .catch(function (err) {
        setBusy(false);
        add('model', '⚠️ ' + err.message + '\n(ข้อความนี้ยังไม่ถูกบันทึก ลองส่งใหม่ได้)');
        renderChoices();
      });
  }

  function send() {
    var t = input.value;
    if (!t.trim() || sendBtn.disabled) return;
    input.value = '';
    sendText(t);
  }
  sendBtn.addEventListener('click', send);

  // ---------- แผง HUD (ข้อมูลมาจากเซิร์ฟเวอร์ โค้ดเป็นคนถือตัวเลขจริง) ----------
  var hud = null;
  var hudTab = 'overview';
  var META_LABELS = { location: '📍 สถานที่', date: '📅 วันที่', time: '🕐 เวลา', weather: '🌤️ อากาศ', goal: '🎯 เป้าหมาย' };
  var BAR_COLORS = { hp: '#e5484d', mp: '#3b82f6', stamina: '#22c55e', sp: '#22c55e' };
  var BAR_PALETTE = ['#e5484d', '#3b82f6', '#22c55e', '#f59e0b', '#a855f7', '#14b8a6', '#ec4899', '#94a3b8'];

  function mk(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function barColor(b, i) { return BAR_COLORS[b.key] || BAR_PALETTE[i % BAR_PALETTE.length]; }
  function barPct(b) { return Math.max(0, Math.min(100, b.max ? (b.cur / b.max) * 100 : 0)); }
  function findBar(h, key) { return h && h.bars.filter(function (x) { return x.key === key; })[0]; }

  function setHud(newHud, events) {
    var old = hud;
    hud = newHud || null;
    renderHudBar(old);
    renderEnemyBar(old);
    if (document.getElementById('hudModal').style.display === 'flex') renderHudPanel();
    if (events && events.length) toast(events);
  }

  // ---------- แถบศัตรูตอนต่อสู้: หลอดสภาพ (ไม่โชว์ตัวเลข) + debuff ตามส่วน แสดงเฉพาะเป้าหมายที่เล็ง ----------
  function enemyPct(c) { return Math.max(0, Math.min(100, c && c.hp != null ? c.hp : 100)); }
  function enemyColor(p) { return p > 60 ? '#22c55e' : (p > 30 ? '#f59e0b' : '#e5484d'); }

  function renderEnemyBar(old) {
    var el = document.getElementById('enemybar');
    el.innerHTML = '';
    var c = hud && hud.combat;
    if (!c) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    var p = enemyPct(c);
    var pp = (old && old.combat && old.combat.enemy === c.enemy) ? enemyPct(old.combat) : p;
    var head = mk('div', 'en-t');
    head.appendChild(mk('span', '', '⚔️ ' + (c.enemy || 'ศัตรู') + (c.group ? ' (กลุ่ม)' : '') + (p <= 0 ? ' — ล้มแล้ว' : '')));
    var sub = [c.range, c.note].filter(Boolean).join(' · ');
    if (sub) head.appendChild(mk('small', '', sub));
    el.appendChild(head);
    var track = mk('div', 'hb-track');
    var fill = mk('div', 'hb-fill');
    fill.style.background = enemyColor(p);
    fill.style.width = pp + '%';
    track.appendChild(fill);
    el.appendChild(track);
    if (pp !== p) requestAnimationFrame(function () { fill.style.width = p + '%'; });
    if (c.debuffs && c.debuffs.length) {
      var chips = mk('div', 'en-chips');
      c.debuffs.forEach(function (d) {
        chips.appendChild(mk('span', 'dchip', (d.part ? d.part + ': ' : '') + (d.text || '')));
      });
      el.appendChild(chips);
    }
  }

  // แถบเล็กด้านบน: หลอดทรัพยากร + ตัวนับ + เลขเทิร์น (กดเพื่อเปิดเมนูเต็ม)
  function renderHudBar(old) {
    var bar = document.getElementById('hudbar');
    bar.innerHTML = '';
    if (!hud) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    hud.bars.forEach(function (b, i) {
      var prev = findBar(old, b.key);
      var box = mk('div', 'hb');
      box.appendChild(mk('div', 'hb-t', (b.icon ? b.icon + ' ' : '') + b.label + ' ' + b.cur + '/' + b.max));
      var track = mk('div', 'hb-track');
      var fill = mk('div', 'hb-fill');
      fill.style.background = barColor(b, i);
      fill.style.width = (prev ? barPct(prev) : barPct(b)) + '%';
      track.appendChild(fill);
      box.appendChild(track);
      bar.appendChild(box);
      if (prev && prev.cur !== b.cur) {
        box.classList.add(b.cur < prev.cur ? 'down' : 'up');
        requestAnimationFrame(function () { fill.style.width = barPct(b) + '%'; });
      }
    });
    hud.counters.forEach(function (c) { bar.appendChild(mk('div', 'hc', (c.icon ? c.icon + ' ' : '') + c.value)); });
    bar.appendChild(mk('div', 'hc', 'T' + hud.turn));
    bar.appendChild(mk('div', 'hmenu', '☰'));
  }

  function renderHudPanel() {
    var tabs = document.getElementById('hudTabs');
    var body = document.getElementById('hudBody');
    tabs.innerHTML = '';
    body.innerHTML = '';
    if (!hud) {
      body.appendChild(mk('div', 'hnote', 'ยังไม่มีข้อมูลสถานะ (เริ่มเกมและยืนยันตัวละครก่อน)'));
      return;
    }
    var list = [{ key: 'overview', label: '🎮 ภาพรวม' }].concat(
      hud.sections.map(function (s) { return { key: s.key, label: s.label }; }));
    if (!list.some(function (t) { return t.key === hudTab; })) hudTab = 'overview';
    list.forEach(function (t) {
      var b = mk('button', 'htab' + (t.key === hudTab ? ' on' : ''), t.label);
      b.addEventListener('click', function () { hudTab = t.key; renderHudPanel(); });
      tabs.appendChild(b);
    });
    if (hudTab === 'overview') renderOverview(body);
    else renderSection(body, hud.sections.filter(function (s) { return s.key === hudTab; })[0]);
  }

  function row(left, right, note) {
    var r = mk('div', 'hrow');
    var l = mk('div', '', left);
    if (note) l.appendChild(mk('small', '', note));
    r.appendChild(l);
    if (right != null && right !== '') r.appendChild(mk('b', '', right));
    return r;
  }

  function renderOverview(body) {
    Object.keys(hud.meta).forEach(function (k) {
      body.appendChild(row(META_LABELS[k] || k, hud.meta[k]));
    });
    hud.bars.forEach(function (b, i) {
      var box = mk('div', 'hb hbig');
      box.appendChild(mk('div', 'hb-t', (b.icon ? b.icon + ' ' : '') + b.label + '  ' + b.cur + ' / ' + b.max));
      var track = mk('div', 'hb-track');
      var fill = mk('div', 'hb-fill');
      fill.style.background = barColor(b, i);
      fill.style.width = barPct(b) + '%';
      track.appendChild(fill);
      box.appendChild(track);
      body.appendChild(box);
    });
    hud.counters.forEach(function (c) {
      body.appendChild(row((c.icon ? c.icon + ' ' : '') + c.label, String(c.value)));
    });
    if (hud.combat) {
      var cb = mk('div', 'hcombat');
      var dbs = (hud.combat.debuffs || []).map(function (d) { return (d.part ? d.part + ': ' : '') + (d.text || ''); });
      cb.textContent = '⚔️ การต่อสู้: ' + [hud.combat.enemy, hud.combat.range, hud.combat.note].filter(Boolean).join(' | ') +
        (dbs.length ? '\nบาดแผล/ผลที่ศัตรูได้รับ: ' + dbs.join(' ; ') : '');
      cb.style.whiteSpace = 'pre-wrap';
      body.appendChild(cb);
    }
    body.appendChild(mk('div', 'hnote', 'Turn ที่เล่นแล้ว: ' + hud.turn));
  }

  // ---------- สกิล: แสดงในเมนู ----------
  // สถานะแสดงเฉพาะ "กำลังฝึก" (สกิลที่ปลดล็อกแล้วแสดงเป็น Lv) ไม่แสดงแหล่งที่มา (แสดงเฉพาะในกล่องแจ้งเตือนตอนได้)
  // ความเสี่ยงแสดงเฉพาะสกิลที่ GM ใส่ไว้ (อันตรายจริง)
  function skillLines(r) {
    var L = [];
    if (r.kind) L.push(r.kind);
    L.push(r.status === 'training' ? 'ฝึกแล้ว ' + r.progress + '% (ยังไม่ปลดล็อก)' : 'ความคืบหน้าเลเวลถัดไป ' + r.progress + '%');
    if (r.cost) L.push('ต้นทุน: ' + r.cost);
    if (r.limit) L.push('ข้อจำกัด: ' + r.limit);
    if (r.note) L.push(r.note);
    return L;
  }

  function skillRow(r) {
    var wrap = mk('div', 'hrow');
    var left = mk('div', '', r.name);
    left.style.flex = '1';
    skillLines(r).forEach(function (t) { left.appendChild(mk('small', '', t)); });
    if (r.risk) left.appendChild(mk('small', 'skrisk', '⚠️ ความเสี่ยง: ' + r.risk));
    var track = mk('div', 'hb-track');
    var fill = mk('div', 'hb-fill sk-fill' + (r.status === 'training' ? ' train' : ''));
    fill.style.width = Math.max(0, Math.min(100, r.progress || 0)) + '%';
    track.appendChild(fill);
    left.appendChild(track);
    wrap.appendChild(left);
    wrap.appendChild(mk('b', '', r.status === 'training' ? '🔸 กำลังฝึก' : 'Lv' + r.level));
    return wrap;
  }

  function renderSection(body, sec) {
    if (!sec) return;
    if (!sec.items.length) { body.appendChild(mk('div', 'hnote', '(ว่าง)')); return; }
    sec.items.forEach(function (r) {
      if (sec.type === 'skills') body.appendChild(skillRow(r));
      else if (sec.type === 'fields') body.appendChild(row(r.k, r.v));
      else if (sec.type === 'items') body.appendChild(row(r.name, '×' + r.qty, r.note));
      else body.appendChild(row(r.name, '', r.note));
    });
  }

  var toastTimer = null;
  function toast(lines) {
    var t = document.getElementById('toast');
    t.innerHTML = '';
    lines.forEach(function (l) { t.appendChild(mk('div', '', l)); });
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 4500);
  }

  document.getElementById('hudbar').addEventListener('click', function () {
    renderHudPanel();
    document.getElementById('hudModal').style.display = 'flex';
  });
  document.getElementById('hudClose').addEventListener('click', function () {
    document.getElementById('hudModal').style.display = 'none';
  });

  // ปุ่มคำสั่งรวม (เป็นปุ่มเดียว แยกเป็นหลายปุ่มทีหลังได้)
  var CMDS = [
    ['/status', 'สถานะ'], ['/character', 'ตัวละคร'], ['/inventory', 'ของ'], ['/skills', 'สกิล'],
    ['/spells', 'เวท'], ['/relations', 'ความสัมพันธ์'], ['/quests', 'เควสต์'], ['/goal', 'เป้าหมาย'],
    ['/power', 'พลัง'], ['/money', 'เงิน'], ['/recap', 'สรุปเรื่อง'], ['/world', 'โลก'],
    ['/rules', 'กฎ'], ['/help', 'ช่วยเหลือ'], ['/save', 'เซฟ'], ['/load', 'โหลด'], ['/ooc', 'คุยนอกเกม']
  ];
  var cmdModal = document.getElementById('cmdModal');
  var cmdGrid = document.getElementById('cmdGrid');
  CMDS.forEach(function (c) {
    var b = document.createElement('button');
    b.textContent = c[0] + ' ' + c[1];
    b.addEventListener('click', function () {
      cmdModal.style.display = 'none';
      if (c[0] === '/ooc') { input.value = '/ooc '; input.focus(); }   // /ooc ต้องพิมพ์ข้อความต่อเอง
      else sendText(c[0]);
    });
    cmdGrid.appendChild(b);
  });
  document.getElementById('cmdbtn').addEventListener('click', function () { cmdModal.style.display = 'flex'; });
  document.getElementById('cmdClose').addEventListener('click', function () { cmdModal.style.display = 'none'; });

  var modal = document.getElementById('modal');
  document.getElementById('newgame').addEventListener('click', function () { modal.style.display = 'flex'; });
  document.getElementById('cancel').addEventListener('click', function () { modal.style.display = 'none'; });

  Array.prototype.forEach.call(document.querySelectorAll('.choice[data-preset]'), function (btn) {
    btn.addEventListener('click', function () {
      modal.style.display = 'none';
      var preset = btn.getAttribute('data-preset');
      setBusy(true, 'กำลังสร้างเกมใหม่...');
      api('newgame', { code: code, preset: preset })
        .then(function (res) {
          if (!res.ok) { add('model', '⚠️ ' + res.error); setBusy(false); return; }
          chat.innerHTML = '';
          setHud(null);
          setup.fields = [];
          curChoices = { list: [], panel: false };
          lastModelText = '';
          add('model', preset === 'magic'
            ? 'เริ่มเกมใหม่ (โลกโรงเรียนเวทมนตร์) กรอกฟอร์มสร้างตัวละครได้เลย (ถ้าฟอร์มปิดไป กดปุ่ม 📝 ฟอร์มด้านบน)'
            : 'เริ่มเกมใหม่ ออกแบบโลกในฟอร์มที่เปิดขึ้น (ถ้าฟอร์มปิดไป กดปุ่ม 📝 ฟอร์มด้านบน)');
          setBusy(false);
          applyStage(res.stage, true);
        })
        .catch(function (err) { add('model', '⚠️ ' + err.message); setBusy(false); });
    });
  });

  // ---------- ฟอร์มออกแบบโลก / สร้างตัวละคร (AI ร่างให้ก่อน แก้ได้ เพิ่มช่องได้ แล้วกดยืนยัน) ----------
  var setup = { kind: null, fields: [], stage: 'playing', busy: false };
  var setupModal = document.getElementById('setupModal');

  var SETUP_TEXT = {
    world: {
      title: '🌍 ออกแบบโลก',
      intro: 'พิมพ์แนวโลกที่อยากเล่น แล้วกด ✨ ให้ AI ร่าง (หรือ 🎲 สุ่มทั้งหมด) แก้ได้ทุกช่อง ' +
             'ช่อง 10 คือช่องที่จะโผล่ในฟอร์มสร้างตัวละครขั้นต่อไป เมื่อกดยืนยันโลกจะถูกล็อก',
      conceptLabel: 'แนวโลก / ธีม / บรรยากาศ (หรือคำสั่งแก้ เช่น "เพิ่มระบบเงิน")',
      conceptHint: 'เช่น โลกหลังวันสิ้นโลกที่ซอมบี้ครองเมือง เน้นเอาตัวรอด',
      ok: '✅ ยืนยันโลก'
    },
    char: {
      title: '🎮 สร้างตัวละคร',
      intro: 'AI ร่างตัวละครให้แล้ว แก้ได้ทุกช่อง 🎲 ข้างช่อง = ให้ AI ร่างช่องนั้นใหม่ ' +
             'ช่องที่พิมพ์ "สุ่ม" GM จะสร้างให้และเก็บความลับไว้ ช่องที่มี * ต้องกรอก',
      conceptLabel: 'แนวตัวละครคร่าว ๆ หรือคำสั่งแก้ (กด ✨ ร่างใหม่ตามนี้)',
      conceptHint: 'เช่น นักเวทสาวขี้อาย แต่ฝีมือดี / เปลี่ยนจุดอ่อนให้ดูน่าสนใจกว่านี้',
      ok: '✅ ยืนยันตัวละครและเริ่มเกม'
    }
  };

  function setupMsg(t) { document.getElementById('setupMsg').textContent = t || ''; }

  function setSetupBusy(b, label) {
    setup.busy = b;
    Array.prototype.forEach.call(setupModal.querySelectorAll('button'), function (x) { x.disabled = b; });
    if (b) setupMsg(label || 'กำลังทำงาน...');
  }

  // stage: 'world' | 'character' | 'playing'
  function applyStage(stage, autoOpen) {
    setup.stage = stage || 'playing';
    document.getElementById('setupbtn').style.display = setup.stage === 'playing' ? 'none' : '';
    if (setup.stage === 'playing') { setupModal.style.display = 'none'; return; }
    if (autoOpen) openSetup(false);
  }

  // keep = true: เปิดฟอร์มเดิมที่ค้างไว้ (ไม่ร่างใหม่)
  function openSetup(keep) {
    var kind = setup.stage === 'world' ? 'world' : 'char';
    var same = keep && setup.kind === kind && setup.fields.length;
    var t = SETUP_TEXT[kind];
    setup.kind = kind;
    document.getElementById('setupTitle').textContent = t.title;
    document.getElementById('setupIntro').textContent = t.intro;
    document.getElementById('setupConceptLabel').textContent = t.conceptLabel;
    document.getElementById('setupConcept').placeholder = t.conceptHint;
    document.getElementById('setupOk').textContent = t.ok;
    document.getElementById('setupPreset').style.display = kind === 'world' ? 'block' : 'none';
    document.getElementById('setupAdd').style.display = kind === 'char' ? 'block' : 'none';
    setupMsg('');
    setupModal.style.display = 'flex';
    if (same) { renderSetupForm(); return; }
    setup.fields = [];
    document.getElementById('setupConcept').value = '';
    renderSetupForm();
    if (kind === 'char') runDraft({});    // ตัวละคร: AI ร่างให้ทันทีตอนเปิด
  }

  function serializeFields() {
    collectSetup();
    return setup.fields
      .filter(function (f) { return !(f.custom && !String(f.label || '').trim()); })
      .map(function (f) {
        return { key: f.key, label: f.label, type: f.type, value: f.value, hint: f.hint,
                 options: f.options || [], custom: !!f.custom, required: !!f.required };
      });
  }

  function collectSetup() {
    setup.fields.forEach(function (f) {
      if (f.el) f.value = f.el.value;
      if (f.labelEl) f.label = f.labelEl.value;
    });
  }

  function renderSetupForm() {
    var box = document.getElementById('setupForm');
    box.innerHTML = '';
    if (!setup.fields.length) {
      box.appendChild(mk('div', 'hnote', setup.kind === 'world'
        ? 'ยังไม่มีร่าง พิมพ์แนวโลกด้านบนแล้วกด ✨ ให้ AI ร่าง หรือ 🎲 สุ่มทั้งหมด'
        : 'ยังไม่มีร่าง กด ✨ ให้ AI ร่าง'));
      return;
    }
    setup.fields.forEach(function (f) {
      var wrap = mk('div', 'sf');
      var head = mk('div', 'sf-head');
      f.labelEl = null;
      if (f.custom) {
        var li = mk('input', 'sf-in');
        li.type = 'text'; li.value = f.label || ''; li.placeholder = 'ชื่อช่อง';
        f.labelEl = li;
        head.appendChild(li);
      } else {
        head.appendChild(mk('label', '', f.label + (f.required ? ' *' : '')));
      }
      var tools = mk('span', 'sf-tools');
      var btn;
      if (f.custom) {
        btn = mk('button', 'sf-mini', '✕');
        btn.title = 'ลบช่องนี้';
        btn.addEventListener('click', function () {
          collectSetup();
          setup.fields.splice(setup.fields.indexOf(f), 1);
          renderSetupForm();
        });
      } else {
        btn = mk('button', 'sf-mini', '🎲');
        btn.title = 'ให้ AI ร่างช่องนี้ใหม่';
        btn.addEventListener('click', function () { runDraft({ only: f.key }); });
      }
      tools.appendChild(btn);
      head.appendChild(tools);
      wrap.appendChild(head);

      var el;
      var val = f.value || '';
      if (f.type === 'textarea') {
        el = mk('textarea', 'sf-in');
        el.rows = Math.max(3, Math.min(12, val.split('\n').length + Math.floor(val.length / 45)));
      } else if (f.type === 'select') {
        el = mk('select', 'sf-in');
        var opts = [''].concat(f.options || []);
        if (val && opts.indexOf(val) < 0) opts.push(val);
        opts.forEach(function (o) {
          var op = mk('option', '', o || '(เลือก)');
          op.value = o;
          el.appendChild(op);
        });
      } else {
        el = mk('input', 'sf-in');
        el.type = 'text';
        if (f.type === 'number') el.setAttribute('inputmode', 'numeric');
      }
      el.value = val;
      f.el = el;
      wrap.appendChild(el);
      if (f.hint) wrap.appendChild(mk('small', 'sf-hint', f.hint));
      box.appendChild(wrap);
    });
  }

  // opts: { concept, only, fresh }
  function runDraft(opts) {
    if (setup.busy) return;
    var concept = opts.concept != null ? opts.concept : document.getElementById('setupConcept').value.trim();
    var current = opts.fresh ? [] : serializeFields();
    if (setup.kind === 'world' && !opts.only && !concept && !current.length) {
      setupMsg('พิมพ์แนวโลกที่อยากเล่นก่อน หรือกด 🎲 สุ่มทั้งหมด');
      return;
    }
    setSetupBusy(true, opts.only ? 'AI กำลังร่างช่องนี้ใหม่...' : 'AI กำลังร่าง...');
    api('draft', { code: code, key: apiKey, kind: setup.kind, concept: concept, fields: current, only: opts.only || '' })
      .then(function (res) {
        setSetupBusy(false);
        if (!res.ok) { setupMsg('⚠️ ' + res.error); return; }
        setup.fields = res.fields;
        renderSetupForm();
        setupMsg('');
      })
      .catch(function (err) { setSetupBusy(false); setupMsg('⚠️ ' + err.message); });
  }

  function setupConfirm() {
    if (setup.busy) return;
    var list = serializeFields();
    if (!list.length) { setupMsg('ยังไม่มีข้อมูลในฟอร์ม กด ✨ ให้ AI ร่างก่อน'); return; }
    var missing = list.filter(function (f) { return f.required && !String(f.value || '').trim(); });
    if (missing.length) {
      setupMsg('⚠️ กรุณากรอกช่องที่มี * : ' + missing.map(function (f) { return f.label; }).join(', '));
      return;
    }

    if (setup.kind === 'world') {
      setSetupBusy(true, 'กำลังล็อกโลก...');
      api('lockworld', { code: code, fields: list })
        .then(function (res) {
          setSetupBusy(false);
          if (!res.ok) { setupMsg('⚠️ ' + res.error); return; }
          setup.fields = [];
          applyStage(res.stage, true);     // ไปขั้นสร้างตัวละคร
        })
        .catch(function (err) { setSetupBusy(false); setupMsg('⚠️ ' + err.message); });
      return;
    }

    setSetupBusy(true, 'กำลังสร้างตัวละครและเนื้อเรื่องลับ (อาจใช้เวลาสักครู่)...');
    api('confirmchar', { code: code, key: apiKey, fields: list })
      .then(function (res) {
        setSetupBusy(false);
        if (!res.ok) { setupMsg('⚠️ ' + res.error); return; }
        setup.fields = [];
        setupModal.style.display = 'none';
        applyStage('playing');
        curChoices = { list: res.choices || [], panel: !!res.panel };
        add('user', res.sent);
        add('model', res.text);
        if (res.hud !== undefined) setHud(res.hud, res.hudEvents);
        renderChoices();
        showSkillPopups(res.skillEvents);
        if (res.memPending) syncMemory(finishSync);
      })
      .catch(function (err) { setSetupBusy(false); setupMsg('⚠️ ' + err.message); });
  }

  // ---------- ปุ่มตัวเลือก + ปุ่มใช้สกิล/ไอเท็ม ----------
  // รายการที่ "กดใช้ได้" มาจากแผงสถานะ (hud): ไอเท็มจากเมนู inventory, สกิล/เวทจากเมนูที่ GM ใส่ usable:true
  // เซฟเก่าที่ไม่มี flag usable เดาจากชื่อเมนู (สกิล เวท พลัง วิชา skill spell magic ability power)
  var USABLE_GUESS = /skill|spell|magic|abilit|power|สกิล|เวท|พลัง|วิชา/i;

  function usableLists() {
    var skills = [], items = [];
    if (!hud) return { skills: skills, items: items };
    hud.sections.forEach(function (s) {
      if (s.key === 'inventory') {
        s.items.forEach(function (r) { items.push({ name: r.name, qty: r.qty, note: r.note || '' }); });
        return;
      }
      if (s.type === 'skills') {                       // สกิลที่ระบบจัดการ: กำลังฝึกก็ลองใช้ได้
        s.items.forEach(function (r) {
          var note = (r.status === 'training' ? 'กำลังฝึก ' + r.progress + '%' : 'Lv' + r.level) + (r.cost ? ' · ' + r.cost : '');
          skills.push({ name: r.name, note: note });
        });
        return;
      }
      var usable = s.usable === true || (s.usable === undefined && USABLE_GUESS.test(s.key + ' ' + s.label));
      if (!usable) return;
      s.items.forEach(function (r) {
        var n = r.name || r.k;
        if (n) skills.push({ name: n, note: r.note || r.v || '' });
      });
    });
    return { skills: skills, items: items };
  }

  function renderChoices() {
    Array.prototype.forEach.call(document.querySelectorAll('.choices'), function (e) { e.remove(); });
    var opts = (curChoices.list || []).map(function (t) { return { label: t, send: t }; });
    if (!opts.length) opts = textChoices(lastModelText);          // ตัวสำรองสำหรับเซฟเก่า
    var u = usableLists();
    var showUse = (curChoices.panel || (hud && hud.combat)) && (u.skills.length || u.items.length);
    if (!opts.length && !showUse) return;

    var box = mk('div', 'choices');
    opts.forEach(function (o) {
      var b = mk('button', 'chbtn', o.label);
      b.addEventListener('click', function () { sendText(o.send); });
      box.appendChild(b);
    });
    if (showUse) {
      if (u.skills.length) {
        var bs = mk('button', 'chbtn chuse', '✨ ใช้สกิล / เวท (' + u.skills.length + ')');
        bs.addEventListener('click', function () { openUse('skill'); });
        box.appendChild(bs);
      }
      if (u.items.length) {
        var bi = mk('button', 'chbtn chuse', '🎒 ใช้ไอเท็ม (' + u.items.length + ')');
        bi.addEventListener('click', function () { openUse('item'); });
        box.appendChild(bi);
      }
    }
    chat.appendChild(box);
    chat.scrollTop = chat.scrollHeight;
  }

  var useModal = document.getElementById('useModal');
  var useKind = 'skill';

  function openUse(kind) {
    useKind = kind;
    var u = usableLists();
    var list = kind === 'skill' ? u.skills : u.items;
    document.getElementById('useTitle').textContent = kind === 'skill' ? '✨ ใช้สกิล / เวท' : '🎒 ใช้ไอเท็ม';
    var box = document.getElementById('useList');
    box.innerHTML = '';
    if (!list.length) box.appendChild(mk('div', 'hnote', '(ไม่มีรายการ)'));
    list.forEach(function (r) {
      var b = mk('button', 'useit');
      var left = mk('div', '', r.name);
      if (r.note) left.appendChild(mk('small', '', r.note));
      b.appendChild(left);
      if (kind === 'item') b.appendChild(mk('b', '', '×' + r.qty));
      b.addEventListener('click', function () { useEntry(r.name); });
      box.appendChild(b);
    });
    useModal.style.display = 'flex';
  }

  function useEntry(name) {
    var target = document.getElementById('useTarget').value.trim();
    var text = (useKind === 'skill' ? 'ใช้ ' : 'ใช้ไอเท็ม ') + name + (target ? ' กับ ' + target : '');
    useModal.style.display = 'none';
    document.getElementById('useTarget').value = '';
    sendText(text);
  }

  document.getElementById('useClose').addEventListener('click', function () { useModal.style.display = 'none'; });

  // ---------- กล่องแจ้งเตือนสกิล (ได้รับสกิลใหม่ / ปลดล็อกแล้ว) มีปุ่มรับทราบอย่างเดียว ----------
  var skillModal = document.getElementById('skillModal');
  var skillQueue = [];

  function skField(label, text, cls) {
    var box = document.getElementById('skBody');
    box.appendChild(mk('div', 'skl', label));
    box.appendChild(mk('div', 'skv' + (cls ? ' ' + cls : ''), text));
  }

  function nextSkillPopup() {
    var p = skillQueue.shift();
    if (!p) { skillModal.style.display = 'none'; return; }
    var s = p.skill || {};
    document.getElementById('skTitle').textContent = p.type === 'unlock' ? '🔓 ปลดล็อกสกิลแล้ว' : '✨ คุณได้รับสกิลใหม่';
    document.getElementById('skName').textContent = s.name || '';
    document.getElementById('skMeta').textContent = [s.kind,
      s.status === 'training' ? 'กำลังฝึก ' + (s.progress || 0) + '% (ยังไม่ปลดล็อกเต็มที่)' : 'Lv' + (s.level || 1)]
      .filter(Boolean).join(' · ');
    var box = document.getElementById('skBody');
    box.innerHTML = '';
    if (p.reason) skField('เหตุผล', p.reason);
    if (p.type !== 'unlock' && p.source) skField('ได้มาจาก', p.source);
    if (s.cost) skField('ต้นทุน', s.cost);
    if (s.limit) skField('ข้อจำกัด', s.limit);
    if (s.risk) skField('ความเสี่ยง', s.risk, 'skrisk');
    skillModal.style.display = 'flex';
  }

  function showSkillPopups(list) {
    if (!list || !list.length) return;
    skillQueue = skillQueue.concat(list);
    if (skillModal.style.display !== 'flex') nextSkillPopup();
  }

  document.getElementById('skOk').addEventListener('click', nextSkillPopup);

  document.getElementById('setupDraft').addEventListener('click', function () { runDraft({}); });
  document.getElementById('setupRandom').addEventListener('click', function () { runDraft({ concept: 'สุ่ม', fresh: true }); });
  document.getElementById('setupOk').addEventListener('click', setupConfirm);
  document.getElementById('setupClose').addEventListener('click', function () {
    if (setup.busy) return;
    setupModal.style.display = 'none';
  });
  document.getElementById('setupbtn').addEventListener('click', function () { openSetup(true); });
  document.getElementById('setupAdd').addEventListener('click', function () {
    collectSetup();
    setup.fields.push({ key: 'custom_' + Date.now(), label: '', type: 'textarea', value: '', hint: '',
                        options: [], custom: true, required: false });
    renderSetupForm();
  });
  document.getElementById('setupPreset').addEventListener('click', function () {
    if (setup.busy) return;
    setSetupBusy(true, 'กำลังใช้โลกพรีเซ็ต...');
    api('usepreset', { code: code, preset: 'magic' })
      .then(function (res) {
        setSetupBusy(false);
        if (!res.ok) { setupMsg('⚠️ ' + res.error); return; }
        setup.fields = [];
        applyStage(res.stage, true);
      })
      .catch(function (err) { setSetupBusy(false); setupMsg('⚠️ ' + err.message); });
  });
</script>
</body>
</html>
